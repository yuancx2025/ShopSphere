version: '3.8'

services:
  # Local Postgres 16 (same major version as Neon). Wipe the old MySQL volume:
  #   docker compose down -v
  db:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_v2
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rollback / dump source only. Does not work with the Postgres-only backend.
  #   docker compose --profile mysql up mysql
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    profiles:
      - mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_v2
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ecommerce_v2
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      BASE_URL: http://localhost:3000/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_stripe_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-ShopSphereDevSecretKeyMustBeAtLeast256BitsLongForHS256!!}
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network

  # React Frontend
  frontend:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/}
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/
    ports:
      - "3000:80"
    networks:
      - ecommerce-network

  # Adminer (optional - database management)
  adminer:
    image: adminer
    container_name: ecommerce-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - ecommerce-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge
