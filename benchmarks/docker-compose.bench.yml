# Dedicated benchmark stack. It runs as its own Compose project, with its own
# database volume and no fixed container names, so it never touches the dev
# stack in ../docker-compose.yml. Drive it with benchmarks/bench.py.
#
# Resource limits are part of the benchmark contract: keep them fixed for any
# A/B comparison and record them (bench.py copies them into each run manifest).
#
# bench.py passes -p $BENCH_PROJECT, so two worktrees can each run their own stack (with
# their own database volume) by setting BENCH_PROJECT and the BENCH_*_PORT variables.
name: shopsphere-bench

services:
  mysql:
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: bench-root
      MYSQL_DATABASE: shopsphere_bench
      MYSQL_USER: shopsphere
      MYSQL_PASSWORD: bench
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=ON
      - --max-connections=200
    volumes:
      - bench_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=bench-root mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    cpus: ${BENCH_MYSQL_CPUS:-2}
    mem_limit: ${BENCH_MYSQL_MEM:-1g}

  # Sprint 2 catalog cache. Always running so `bench.py cache stop|start` can inject an outage; the backend only
  # uses it when BENCH_CACHE=redis. No persistence: a restart is a cold cache.
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: ${BENCH_REDIS_CPUS:-1}
    mem_limit: ${BENCH_REDIS_MEM:-256m}

  # Sprint 3 search projection. Only started by `bench.py up --search` (profile "search"); MySQL stays the source of
  # truth. Security is off because the port is never published outside the bench network.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Explicit heap: about half the container limit, the rest for Lucene's file-system cache.
      ES_JAVA_OPTS: -Xms${BENCH_ES_HEAP:-1g} -Xmx${BENCH_ES_HEAP:-1g}
      # A nearly full laptop disk would otherwise flip the index to read-only mid-run.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
    cpus: ${BENCH_ES_CPUS:-2}
    mem_limit: ${BENCH_ES_MEM:-2g}

  # Sprint 5 catalog-event broker. Only started by the "events" profile. One name server and one broker, both on
  # the classic remoting protocol (no proxy). The image is multi-arch (amd64 and arm64). Heaps are set explicitly
  # because the stock start scripts ask for up to 8 GB. JAVA_OPT_EXT comes last, so its -Xmx wins.
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    profiles: ["events"]
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: -Xms${BENCH_MQ_NAMESRV_HEAP:-128m} -Xmx${BENCH_MQ_NAMESRV_HEAP:-128m}
    healthcheck:
      # A port probe, not mqadmin: every mqadmin call starts another JVM inside this container's memory limit.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    cpus: 0.5
    mem_limit: ${BENCH_MQ_NAMESRV_MEM:-384m}

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    profiles: ["events"]
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    # brokerIP1 is the address the broker advertises through the name server, so it has to be the service name
    # that other containers on the bench network resolve. Topics are created explicitly (never auto-created by the
    # first send), with admin commands run in a one-off container so they don't share the broker's memory limit.
    command:
      - sh
      - -c
      - |
        printf 'brokerClusterName=bench\nbrokerName=broker-a\nbrokerId=0\nbrokerIP1=rocketmq-broker\nautoCreateTopicEnable=false\nflushDiskType=ASYNC_FLUSH\n' > /tmp/broker.conf
        exec sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf
    environment:
      JAVA_OPT_EXT: >-
        -Xms${BENCH_MQ_BROKER_HEAP:-512m} -Xmx${BENCH_MQ_BROKER_HEAP:-512m} -Xmn256m
        -XX:MaxDirectMemorySize=256m
    healthcheck:
      # Port probe for the same reason. bench.py checks that the broker registered with the name server.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/10911"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s
    cpus: ${BENCH_MQ_BROKER_CPUS:-1}
    mem_limit: ${BENCH_MQ_BROKER_MEM:-1g}

  backend:
    build:
      context: ../backend
    image: ${BENCH_BACKEND_IMAGE:-shopsphere-backend:bench}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: bench
      # A/B switch: none (every read goes to MySQL) or redis (cache-aside). Set by `bench.py up --cache`.
      SPRING_CACHE_TYPE: ${BENCH_CACHE:-none}
      CATALOG_CACHE_TTL: ${BENCH_CACHE_TTL:-60s}
      SPRING_DATA_REDIS_HOST: redis
      # Sprint 3: Elasticsearch engine and indexer. Set by `bench.py up --search`. The MySQL FULLTEXT engine is
      # always available, so ?engine=mysql|elasticsearch compares both on one stack.
      SEARCH_ELASTICSEARCH_ENABLED: ${BENCH_SEARCH:-false}
      # Engine for requests without ?engine= (the React UI): elasticsearch with --search, else mysql.
      SEARCH_ENGINE: ${BENCH_SEARCH_ENGINE:-mysql}
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_bench
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: bench
      STRIPE_SECRET_KEY: sk_test_benchmark_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_benchmark_placeholder
      JWT_SECRET: ShopSphereBenchmarkSecretKeyMustBeAtLeast256BitsLong!!
      # Below 2 CPUs or ~1.8 GB the JVM silently picks SerialGC, so choose G1 explicitly.
      JAVA_TOOL_OPTIONS: -XX:+UseG1GC -XX:MaxRAMPercentage=70
    ports:
      - "127.0.0.1:${BENCH_BACKEND_PORT:-18080}:8080"
    healthcheck:
      # The bench profile moves actuator to the internal management port.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    cpus: ${BENCH_BACKEND_CPUS:-2}
    mem_limit: ${BENCH_BACKEND_MEM:-1536m}

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bench_prometheus:/prometheus
    ports:
      - "127.0.0.1:${BENCH_PROMETHEUS_PORT:-9090}:9090"
    cpus: 0.5
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: bench-admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shopsphere-benchmark.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${BENCH_GRAFANA_PORT:-3001}:3000"
    cpus: 0.5
    mem_limit: 384m

volumes:
  bench_mysql:
  bench_prometheus:
