# Benchmark profile (benchmarks/docker-compose.bench.yml).

# Actuator lives on a separate port that the bench stack never publishes to the
# host, so /actuator/prometheus stays internal. Port 8080 serves no actuator paths.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=shopsphere

# Server-side latency histograms per route template (uri="/product/{productID}").
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# Fixed and recorded so connection-pool pressure is comparable between runs.
spring.datasource.hikari.pool-name=shopsphere
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10

# Tomcat thread-pool metrics.
server.tomcat.mbeanregistry.enabled=true

# Per-request logging would distort latency under load.
logging.level.root=WARN
logging.level.ecommerce=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Checkout runs against the deterministic fake provider, so the benchmark never calls Stripe.
payment.provider=fake
