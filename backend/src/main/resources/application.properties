# Local Compose defaults (postgres:16). Override with Neon pooled/direct URLs in .env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_v2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecommerce}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecommerce}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway needs a direct (non-pooler) URL on Neon. Same URL as the datasource is fine for local Postgres.
spring.flyway.url=${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
spring.flyway.user=${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

# Flyway applies V1; Hibernate only checks the mapping matches the DB
spring.jpa.hibernate.ddl-auto=validate
# Persist Java enums as VARCHAR rather than Postgres native enum types.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# Literal defaults. Env vars with the same name still override these
# (do not use KEY=${KEY:default} — Spring treats that as a circular placeholder).
BASE_URL=http://localhost:3000/
STRIPE_SECRET_KEY=sk_test_your_stripe_key
STRIPE_WEBHOOK_SECRET=
JWT_SECRET=ShopSphereDevSecretKeyMustBeAtLeast256BitsLongForHS256!!
JWT_EXPIRATION_MS=86400000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
