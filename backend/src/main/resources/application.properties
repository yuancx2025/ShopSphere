spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_v2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway applies V1; Hibernate only checks the mapping matches the DB
spring.jpa.hibernate.ddl-auto=validate
# Flyway stores Java enums as VARCHAR; Hibernate 6 otherwise expects MySQL ENUM.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# Literal defaults. Env vars with the same name still override these
# (do not use KEY=${KEY:default} — Spring treats that as a circular placeholder).
BASE_URL=http://localhost:3000/
STRIPE_SECRET_KEY=sk_test_your_stripe_key
STRIPE_WEBHOOK_SECRET=
JWT_SECRET=ShopSphereDevSecretKeyMustBeAtLeast256BitsLongForHS256!!
JWT_EXPIRATION_MS=86400000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Payment provider: stripe (default) or fake (deterministic, for tests and the benchmark stack only).
payment.provider=stripe

# How long a checkout reservation holds stock. Stripe requires at least 30 minutes.
checkout.session-ttl=PT30M

# Catalog cache (Sprint 2). none: every read goes to MySQL. redis: cache-aside for product detail and first
# catalog pages. Override with SPRING_CACHE_TYPE; this is the A/B switch for the benchmark.
spring.cache.type=none
# Bounds how stale a cached product (including its displayed stock) can be. Admin edits evict immediately.
catalog.cache.ttl=60s
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Short timeouts so a slow or missing Redis falls back to MySQL instead of holding the request.
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=200ms
spring.data.redis.repositories.enabled=false
# After a Redis error, skip Redis for this long and read MySQL directly (see RedisBypassCache).
catalog.cache.bypass-after-error=1s
# A Redis outage degrades the cache, not the app, so it must not mark the backend unhealthy.
management.health.redis.enabled=false

# Product search (Sprint 3). search.engine is the default for GET /product/search (mysql FULLTEXT baseline or
# elasticsearch); a request can pick one with ?engine=. Elasticsearch and its indexer only run when enabled.
search.engine=mysql
search.elasticsearch.enabled=false
search.elasticsearch.index=products
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=1s
spring.elasticsearch.socket-timeout=5s
# ISO-8601: the @Scheduled annotation in this Spring version does not accept "200ms".
search.indexer.poll-interval=PT0.2S
search.indexer.batch-size=500
# Search is optional: an Elasticsearch outage returns 503 from /product/search but leaves the backend healthy.
management.health.elasticsearch.enabled=false

# Catalog events (Sprint 5). With events on, the outbox (search_index_jobs) is published to RocketMQ as
# ProductChanged and two consumer groups apply it: search-indexer (needs search.elasticsearch.enabled) and
# cache-invalidator (needs spring.cache.type=redis). Off: Sprint 3's indexer drains the outbox directly.
events.enabled=false
events.namesrv=localhost:9876
events.topic=catalog-product-changed
# ISO-8601 for the same @Scheduled reason as the indexer.
events.publisher.poll-interval=PT0.1S
events.publisher.batch-size=200
events.publisher.send-timeout=3s
events.publisher.retries=2
events.consumer.max-reconsume-times=5
events.consumer.threads=4
