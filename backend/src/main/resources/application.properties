spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_v2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway applies V1; Hibernate only checks the mapping matches the DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

BASE_URL=${BASE_URL:http://localhost:3000/}
STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:sk_test_your_stripe_key}
STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:}
JWT_SECRET=${JWT_SECRET:ShopSphereDevSecretKeyMustBeAtLeast256BitsLongForHS256!!}
JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
